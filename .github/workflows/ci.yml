name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: RunenUI validation
    uses: dornglut/github-workflows/.github/workflows/reusable-rust-cargo-validate.yml@624cb41adeed21a6461eb838bc7330bd0a5079fd

  m8d-render-evidence:
    name: M8D real-wgpu evidence
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/m8d-integrated-closure'
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Prove checked-out pull-request head
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual_revision="$(git rev-parse HEAD)"
          test "${actual_revision}" = "${EXPECTED_REVISION}"
          echo "Exact M8D revision: ${actual_revision}"

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Generate real-wgpu M8D evidence
        id: evidence
        env:
          RUNENUI_M8D_EVIDENCE_DIR: ${{ runner.temp }}/m8d-evidence
        run: |
          set -euo pipefail
          mkdir -p "${RUNENUI_M8D_EVIDENCE_DIR}"
          cargo +stable test --locked -p runenui_render_wgpu --test m8d_visual -- --nocapture
          cargo +stable test --locked -p runenui_render_wgpu --test shaped_text -- --nocapture
          png="${RUNENUI_M8D_EVIDENCE_DIR}/m8d-production-text-contact-sheet.png"
          manifest="${RUNENUI_M8D_EVIDENCE_DIR}/m8d-production-text-evidence.txt"
          if [[ -f "${png}" && -f "${manifest}" ]]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
            echo "Real-wgpu M8D visual evidence generated."
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "Real-wgpu M8D visual evidence is unavailable on this runner; no review artifact was produced."
          fi

      - name: Upload human-inspectable M8D evidence
        if: steps.evidence.outputs.available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: m8d-real-wgpu-evidence-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/m8d-evidence
          if-no-files-found: error
          retention-days: 7
